<script>
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter') run();
});

function log(t,c){
  var d=document.getElementById('lg');
  var el=document.createElement('div');
  el.className='lg '+(c||'');
  el.innerHTML='<div class="dot"></div><span>'+t+'</span>';
  d.appendChild(el);
  d.scrollTop=d.scrollHeight;
}

function prog(p,t){
  document.getElementById('pf').style.width=p+'%';
  if(t) document.getElementById('pt').textContent=t;
}

function showErr(m){
  document.getElementById('er').textContent=m;
  document.getElementById('er').classList.add('on');
  document.getElementById('pb').classList.remove('on');
}

function reset(){
  ['rc','pb'].forEach(id=>{
    document.getElementById(id).classList.remove('on');
  });
  document.getElementById('er').classList.remove('on');
  document.getElementById('lg').innerHTML='';
  prog(0,'');
}

function triggerDL(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function san(n){
  return (n||'img')
    .replace(/[^a-zA-Z0-9_\- ]/g,'')
    .trim()
    .slice(0,30)||'img';
}

function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

async function fetchWikimedia(q,limit){
  var url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit='+limit+'&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

  var r=await fetch(url);
  var data=await r.json();

  var pages=Object.values((data.query||{}).pages||{});

  return pages.map(p=>{
    var ii=p.imageinfo[0];
    return {
      url:ii.url,
      name:p.title.replace('File:','')
    };
  });
}

function getPicsum(limit){
  var arr=[];
  for(var i=0;i<limit;i++){
    arr.push({
      url:'https://picsum.photos/seed/'+Math.random()+'/800/600',
      name:'photo_'+i
    });
  }
  return arr;
}

async function dlBlob(url){
  var r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.blob();
}

async function run(){

  var q=document.getElementById('q').value.trim();
  if(!q) return;

  var cnt=parseInt(document.getElementById('cnt').value);

  document.getElementById('go').disabled=true;

  reset();
  document.getElementById('pb').classList.add('on');

  prog(5,'Searching...');

  try{

    var images=[];

    log('Wikimedia search','i');

    try{
      var wm=await fetchWikimedia(q,cnt);
      images=images.concat(wm);
      log('Wikimedia: '+wm.length,'ok');
    }catch(e){
      log('Wikimedia failed','er');
    }

    if(images.length<cnt){
      log('Adding random images','i');
      images=images.concat(getPicsum(cnt-images.length));
    }

    images=images.slice(0,cnt);

    prog(20,'Downloading...');

    var zip=new JSZip();

    var done=0;

    for(let i=0;i<images.length;i++){

      var img=images[i];

      try{

        var blob=await dlBlob(img.url);

        zip.file(
          String(i+1).padStart(3,'0')+'_'+san(img.name)+'.jpg',
          blob
        );

        done++;

        log('OK '+img.name,'ok');

      }catch(e){

        log('Fail '+img.name,'er');

      }

      prog(
        20+Math.round((i/images.length)*70),
        (i+1)+'/'+images.length
      );

    }

    if(done===0)
      throw new Error('No images downloaded');

    prog(95,'Creating ZIP');

    var content=await zip.generateAsync({
      type:'blob',
      compression:'DEFLATE'
    });

    var name=q.replace(/\W/g,'_')+'_images.zip';

    prog(100,'Done');

    document.getElementById('rt').textContent='ZIP Ready ('+done+')';
    document.getElementById('rs').textContent=fmtSize(content.size);

    document.getElementById('dl').onclick=()=>{
      triggerDL(content,name);
    };

    document.getElementById('rc').classList.add('on');

    triggerDL(content,name);

  }catch(e){

    showErr(e.message);

  }

  document.getElementById('go').disabled=false;
}
</script>
